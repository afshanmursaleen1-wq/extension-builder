[project]
name = "extension-builder"
version = "1.0.0"
description = "SaaS Chrome Extension Builder - Generate complete Chrome extensions from prompts, images, URLs, or code"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "pillow>=10.4.0",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "aiofiles>=24.1.0",
    "beautifulsoup4>=4.12.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
